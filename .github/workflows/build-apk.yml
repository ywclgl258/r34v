name: Kotlin Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_classes:
        description: 'Android 测试类（逗号分隔，留空使用默认回归）'
        required: false
        default: ''
        type: string
      signed_release:
        description: '从受保护的 main 构建并验签正式 APK'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Kotlin and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: r34v-development-not-for-updates
          path: app/build/outputs/apk/debug/*.apk

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release && github.repository == 'ywclgl258/r34v' && github.ref == 'refs/heads/main'
    needs: [verify, android-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure release-signing in GitHub with main-only deployment, required reviewers,
    # and all eight signing secrets scoped to that environment. YAML cannot set those protections.
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build and verify both signed APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LEGACY_KEYSTORE_BASE64: ${{ secrets.LEGACY_KEYSTORE_BASE64 }}
          LEGACY_KEYSTORE_PASSWORD: ${{ secrets.LEGACY_KEYSTORE_PASSWORD }}
          LEGACY_KEY_ALIAS: ${{ secrets.LEGACY_KEY_ALIAS }}
          LEGACY_KEY_PASSWORD: ${{ secrets.LEGACY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export R34V_SIGNING_HOME="$(mktemp -d "$RUNNER_TEMP/r34v-signing.XXXXXX")"
          trap 'rm -rf -- "$R34V_SIGNING_HOME"' EXIT
          export KEYSTORE_PATH="$R34V_SIGNING_HOME/release.jks"
          export LEGACY_KEYSTORE_PATH="$R34V_SIGNING_HOME/historical.jks"
          printf '%s' "${KEYSTORE_BASE64:?Missing release signing key}" | base64 --decode > "$KEYSTORE_PATH"
          printf '%s' "${LEGACY_KEYSTORE_BASE64:?Missing historical signing key}" | base64 --decode > "$LEGACY_KEYSTORE_PATH"
          unset KEYSTORE_BASE64 LEGACY_KEYSTORE_BASE64
          ./gradlew :app:validateReleaseSigning :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: r34v-kotlin-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

  android-regression:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_API: ${{ matrix.api }}
          TEST_CLASSES: ${{ inputs.test_classes }}
          DEFAULT_TEST_CLASSES: |
            com.r34v.r34v.OptimizationUiTest
            com.r34v.r34v.OptimizationIoTest
            com.r34v.r34v.SiteSessionTest
            com.r34v.r34v.IwaraSessionNetworkTest
            com.r34v.r34v.SiteFunctionsUiTest
            com.r34v.r34v.FavoriteCollectionUiTest
            com.r34v.r34v.GalleryOfflineReadingUiTest
            com.r34v.r34v.OfflinePlaybackQueueTest
            com.r34v.r34v.LocalSeekPreviewTest
            com.r34v.r34v.VideoRemovalTest
            com.r34v.r34v.SubscriptionUiTest
            com.r34v.r34v.StorageLifecycleTest
            com.r34v.r34v.StorageStartupTest
            com.r34v.r34v.DownloadCacheTest
            com.r34v.r34v.RouDataSourceTest
            com.r34v.r34v.TimestampTextUiTest
            com.r34v.r34v.ExternalPlayerUiTest
            com.r34v.r34v.HlsPlaybackIntegrationTest
            com.r34v.r34v.GalleryUiTest
            com.r34v.r34v.UnifiedDownloadsTest
            com.r34v.r34v.FeatureBatchUiTest
            com.r34v.r34v.ModernUiTest
            com.r34v.r34v.FeedPositionUiTest#discoverOpensAndSearchesTheCurrentSiteCategoryDirectory
            com.r34v.r34v.NextResponsiveUiTest
            com.r34v.r34v.NewFeaturesUiTest#pictureInPictureKeepsPlayingAndReturnsToTheSameEngine
            com.r34v.r34v.GalleryExportTest
            com.r34v.r34v.SavedSearchStorageTest
            com.r34v.r34v.ShelfOrganizationUiTest
            com.r34v.r34v.FeatureStorageTest#portableBackupRestoresIntoAnotherStoreWithoutReplacingCredentials
            com.r34v.r34v.BrowseUiTest#playerQualitySpeedFullScreenAndPositionSurviveRecreation
            com.r34v.r34v.BrowseUiTest#portraitFullscreenWaitsForDimensionsAndStaysExitedAfterRecreation
            com.r34v.r34v.BrowseUiTest#aStoredAutoDowngradeDoesNotPinTheNextPlayback
            com.r34v.r34v.BrowseUiTest#refreshAfterExpiredStreamPlaysTheAvailableLowerQuality
            com.r34v.r34v.MediaProbeTest
            com.r34v.r34v.LinkSpeedTest
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          # Nexus 4 keeps a standard-width layout with fewer pixels for the headless renderer.
          profile: ${{ matrix.api == 36 && 'Nexus 4' || 'pixel_2' }}
          disable-animations: true
          script: python3 .github/scripts/android_regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-regression-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/ci-first-attempt/
